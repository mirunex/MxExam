{% extends 'superadmin_base.html' %}
{% block title %}New institution{% endblock %}

{% block content %}
<div class="top">
    <div>
        <h1>New institution</h1>
        <p class="sub">Add an institution, then assign an administrator.</p>
    </div>
</div>

<div class="panel" style="max-width:560px">
    <form method="post" novalidate>
        {% csrf_token %}
        <div style="margin-bottom:18px">
            <label for="{{ form.name.id_for_label }}">{{ form.name.label }}</label>
            {{ form.name }}
            {% for error in form.name.errors %}
                <div class="err">{{ error }}</div>
            {% endfor %}
        </div>
        <div style="display:flex;gap:10px">
            <button type="submit" class="btn">Create</button>
            <a class="btn ghost" href="{% url 'superadmin_dashboard' %}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
